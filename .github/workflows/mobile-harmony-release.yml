name: Mobile Harmony Release

on:
  push:
    tags:
      - 'mobile-harmony-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact Harmony version assertion, e.g. 0.0.47'
        required: false
        type: string
      publish_github_release:
        description: 'Create or update the mobile-harmony-v<version> GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-harmony-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Verify trusted release initiator before checkout
        env:
          HARMONY_RELEASE_ALLOWED_ACTOR: ${{ vars.HARMONY_RELEASE_ALLOWED_ACTOR }}
          HARMONY_RELEASE_ORIGINAL_ACTOR: ${{ github.actor }}
          HARMONY_RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          allowlist="$HARMONY_RELEASE_ALLOWED_ACTOR"
          test -n "$allowlist"
          case "$allowlist" in
            ,*|*,|*,,*|*[[:space:]]*)
              echo 'Release actor allowlist must be a comma-separated login list' >&2
              exit 1
              ;;
          esac
          IFS=',' read -r -a allowed_actors <<< "$allowlist"
          for actor in \
            "$HARMONY_RELEASE_ORIGINAL_ACTOR" \
            "$HARMONY_RELEASE_TRIGGERING_ACTOR"; do
            test -n "$actor"
            authorized=false
            for allowed_actor in "${allowed_actors[@]}"; do
              if [ "$allowed_actor" = "$actor" ]; then
                authorized=true
                break
              fi
            done
            test "$authorized" = true
          done

      - name: Verify source belongs to the default branch before checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_pattern='^[0-9a-f]{40,64}$'
          if ! [[ "$GITHUB_SHA" =~ $commit_pattern ]]; then
            echo 'Release source commit is malformed' >&2
            exit 1
          fi
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          test -n "$default_branch"
          default_sha="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/commits" \
            -f sha="$default_branch" \
            -f per_page=1 \
            --jq '.[0].sha')"
          if ! [[ "$default_sha" =~ $commit_pattern ]]; then
            echo 'Default branch commit is malformed' >&2
            exit 1
          fi
          comparison="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default_sha")"
          comparison_status="$(printf '%s' "$comparison" | jq -r .status)"
          behind_by="$(printf '%s' "$comparison" | jq -r .behind_by)"
          test "$behind_by" -eq 0
          case "$comparison_status" in
            ahead|identical) ;;
            *)
              echo "Release source is not in default branch history: $comparison_status" >&2
              exit 1
              ;;
          esac

      - name: Verify signing environment approval policy
        env:
          GH_TOKEN: ${{ github.token }}
          HARMONY_RELEASE_ENVIRONMENT: harmony-production
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG_PATTERN: mobile-harmony-v*
        run: |
          set -euo pipefail
          policy="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$HARMONY_RELEASE_ENVIRONMENT")"
          reviewer_count="$(printf '%s' "$policy" | jq \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')"
          prevent_self_review="$(printf '%s' "$policy" | jq -r \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review] | any')"
          test "$reviewer_count" -gt 0
          test "$prevent_self_review" = true
          deployment_policy_ok="$(printf '%s' "$policy" | jq -r '
            .deployment_branch_policy as $policy |
            if $policy != null and
              $policy.protected_branches == false and
              $policy.custom_branch_policies == true
            then "true" else "false" end')"
          test "$deployment_policy_ok" = true
          branch_policies="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$HARMONY_RELEASE_ENVIRONMENT/deployment-branch-policies")"
          printf '%s' "$branch_policies" | jq -e \
            --arg branch "$RELEASE_BRANCH" --arg tag_pattern "$RELEASE_TAG_PATTERN" '
              any(.branch_policies[]?; .type == "branch" and .name == $branch) and
              any(.branch_policies[]?; .type == "tag" and .name == $tag_pattern)
            ' >/dev/null
          case "$GITHUB_REF" in
            "refs/heads/$RELEASE_BRANCH"|refs/tags/${RELEASE_TAG_PATTERN}) ;;
            *)
              echo "Release ref $GITHUB_REF is outside the configured branch/tag policy" >&2
              exit 1
              ;;
          esac

  mobile-tests:
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          pnpm test:production-dependency-audit
          pnpm audit:production-dependencies

      - name: Verify mobile application
        working-directory: mobile
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test

  build-and-sign:
    needs: [authorize-release, mobile-tests]
    runs-on: [self-hosted, macOS, ARM64, harmonyos]
    timeout-minutes: 45
    environment: harmony-production
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact_name: orca-mobile-harmony-${{ steps.release.outputs.version }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    defaults:
      run:
        working-directory: mobile/harmony

    steps:
      - name: Verify exact signing runner identity before checkout
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_RUNNER_NAME: ${{ vars.HARMONY_RELEASE_SIGNING_RUNNER_NAME }}
          SENTINEL_PATH: ${{ vars.HARMONY_RELEASE_SIGNING_RUNNER_SENTINEL_PATH }}
          EXPECTED_SENTINEL_SHA256: ${{ vars.HARMONY_RELEASE_SIGNING_RUNNER_SENTINEL_SHA256 }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted
          test "$ACTUAL_RUNNER_OS" = macOS
          test "$ACTUAL_RUNNER_ARCH" = ARM64
          test -n "$EXPECTED_RUNNER_NAME"
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$SENTINEL_PATH" = /Users/Shared/orca/harmony-release-runner.sentinel
          [[ "$EXPECTED_SENTINEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$SENTINEL_PATH"
          test ! -L "$SENTINEL_PATH"
          test "$(stat -f '%Su' "$SENTINEL_PATH")" = root
          test "$(stat -f '%Lp' "$SENTINEL_PATH")" = 644
          actual_sentinel_sha256="$(shasum -a 256 "$SENTINEL_PATH" | awk '{print $1}')"
          test "$actual_sentinel_sha256" = "$EXPECTED_SENTINEL_SHA256"

      - name: Initialize runner-local release paths before checkout
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP"
          runner_temp="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          {
            printf 'HARMONY_RELEASE_TOOLCHAIN_EVIDENCE_PATH=%s/orca-harmony-toolchain.json\n' "$runner_temp"
            printf 'HARMONY_RELEASE_BUILD_EVIDENCE_PATH=%s/orca-harmony-build-evidence.txt\n' "$runner_temp"
            printf 'HARMONY_RELEASE_REFERENCE_HAP_PATH=%s/orca-harmony-reference-release.hap\n' "$runner_temp"
            printf 'HARMONY_RELEASE_REBUILD_ROOT=%s/orca-harmony-release-rebuild\n' "$runner_temp"
            printf 'TMPDIR=%s\n' "$runner_temp"
          } >> "$GITHUB_ENV"

      - name: Checkout trusted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: mobile/harmony/package-lock.json

      - name: Verify trusted release initiator
        env:
          HARMONY_RELEASE_ALLOWED_ACTOR: ${{ vars.HARMONY_RELEASE_ALLOWED_ACTOR }}
          HARMONY_RELEASE_ORIGINAL_ACTOR: ${{ github.actor }}
          HARMONY_RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: npm run verify:release-actors

      - name: Verify source belongs to the release branch
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_BRANCH"
          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "refs/remotes/origin/$RELEASE_BRANCH"

      - name: Resolve DevEco toolchain
        env:
          CONFIGURED_DEVECO_HOME: ${{ vars.HARMONY_DEVECO_HOME }}
        run: |
          set -euo pipefail
          deveco_home="${CONFIGURED_DEVECO_HOME:-/Applications/DevEco-Studio.app/Contents}"
          java_home="$deveco_home/jbr/Contents/Home"
          sdk_home="$deveco_home/sdk"
          hvigorw="$deveco_home/tools/hvigor/bin/hvigorw"
          ohpm="$deveco_home/tools/ohpm/bin/ohpm"
          sign_tool="$sdk_home/default/openharmony/toolchains/lib/hap-sign-tool.jar"

          test -x "$java_home/bin/java"
          test -x "$java_home/bin/keytool"
          test -x "$hvigorw"
          test -x "$ohpm"
          test -f "$sign_tool"

          {
            echo "DEVECO_HOME=$deveco_home"
            echo "DEVECO_SDK_HOME=$sdk_home"
            echo "HAP_SIGN_TOOL_JAR=$sign_tool"
            echo "HARMONY_HVIGORW=$hvigorw"
            echo "HARMONY_OHPM=$ohpm"
            echo "JAVA_HOME=$java_home"
          } >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify npm lockfile integrity
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json
          test -z "$(git status --porcelain=v1 -- package-lock.json)"

      - name: Verify dependency scripts did not mutate tracked Harmony sources
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=no -- .)"

      - name: Verify pinned Harmony toolchain
        run: npm run verify:release-toolchain

      - name: Record build OS and toolchain evidence
        run: |
          set -euo pipefail
          command -v git >/dev/null
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "os=$(sw_vers -productName) $(sw_vers -productVersion) ($(uname -m))"
            echo "kernel=$(uname -sr)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "ohpm=$($HARMONY_OHPM --version | sed -n '1p' | tr -d '\r')"
            echo "hvigor=$($HARMONY_HVIGORW --version | sed -n '1p' | tr -d '\r')"
            echo "java=$($JAVA_HOME/bin/java -version 2>&1 | sed -n '1p' | tr -d '\r')"
            echo "git=$(git --version)"
          } | tee "$HARMONY_RELEASE_BUILD_EVIDENCE_PATH"
          cat "$HARMONY_RELEASE_TOOLCHAIN_EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"
          cat "$HARMONY_RELEASE_BUILD_EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve release version
        id: release
        env:
          MOBILE_HARMONY_ENFORCE_VERSION_CODE: 'true'
          MOBILE_HARMONY_PUBLISH_RELEASE: ${{ github.event.inputs.publish_github_release }}
          MOBILE_HARMONY_RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          MOBILE_HARMONY_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: npm run prepare:release

      - name: Install Harmony dependencies
        run: '"$HARMONY_OHPM" install --all'

      - name: Verify OHPM lockfile integrity
        run: |
          set -euo pipefail
          lockfiles=(
            oh-package-lock.json5
            entry/oh-package-lock.json5
          )
          for lockfile in "${lockfiles[@]}"; do
            test -f "$lockfile"
          done
          git diff --exit-code -- \
            package-lock.json \
            oh-package-lock.json5 \
            entry/oh-package-lock.json5
          test -z "$(git status --porcelain=v1 -- \
            package-lock.json \
            oh-package-lock.json5 \
            entry/oh-package-lock.json5)"

      - name: Verify source and generated bundle
        run: |
          set -euo pipefail
          cmp build-profile.template.json5 build-profile.json5
          npm run check:source-secrets
          npm run typecheck
          npm run test:release-scripts
          npm run codegen
          npm run bundle:harmony
          npm run lint:native

      - name: Build unsigned release HAP
        run: |
          set -euo pipefail
          "$HARMONY_HVIGORW" \
            --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=release \
            assembleHap \
            --no-daemon
          npm run verify:release-hap -- \
            entry/build/default/outputs/default/entry-default-unsigned.hap

      - name: Isolated rebuild and compare release HAP contents
        run: |
          set -euo pipefail
          cp entry/build/default/outputs/default/entry-default-unsigned.hap \
            "$HARMONY_RELEASE_REFERENCE_HAP_PATH"
          rm -rf -- "$HARMONY_RELEASE_REBUILD_ROOT"
          git clone --no-hardlinks --no-checkout \
            "$GITHUB_WORKSPACE" "$HARMONY_RELEASE_REBUILD_ROOT"
          git -C "$HARMONY_RELEASE_REBUILD_ROOT" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$HARMONY_RELEASE_REBUILD_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$HARMONY_RELEASE_REBUILD_ROOT/mobile/harmony"
          npm ci
          "$HARMONY_OHPM" install --all
          git -C "$HARMONY_RELEASE_REBUILD_ROOT" diff --exit-code -- \
            mobile/harmony/package-lock.json \
            mobile/harmony/oh-package-lock.json5 \
            mobile/harmony/entry/oh-package-lock.json5
          test -z "$(git -C "$HARMONY_RELEASE_REBUILD_ROOT" status --porcelain=v1 -- \
            mobile/harmony/package-lock.json \
            mobile/harmony/oh-package-lock.json5 \
            mobile/harmony/entry/oh-package-lock.json5)"
          cmp build-profile.template.json5 build-profile.json5
          npm run check:source-secrets
          npm run typecheck
          npm run test:release-scripts
          npm run codegen
          npm run bundle:harmony
          npm run lint:native
          "$HARMONY_HVIGORW" \
            --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=release \
            assembleHap \
            --no-daemon
          npm run verify:release-hap -- \
            entry/build/default/outputs/default/entry-default-unsigned.hap
          npm run compare:release-haps -- \
            "$HARMONY_RELEASE_REFERENCE_HAP_PATH" \
            entry/build/default/outputs/default/entry-default-unsigned.hap \
            | tee -a "$HARMONY_RELEASE_BUILD_EVIDENCE_PATH"

      - name: Generate production SBOM
        run: |
          set -euo pipefail
          mkdir -p dist
          npm run sbom:release -- \
            "dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.sbom.cdx.json"

      - name: Reverify pinned Harmony toolchain before signing
        run: npm run verify:release-toolchain

      - name: Sign and verify release HAP
        env:
          HARMONY_RELEASE_REQUIRE_PROVENANCE: 'true'
          HARMONY_RELEASE_CERT_BASE64: ${{ secrets.HARMONY_RELEASE_CERT_BASE64 }}
          HARMONY_RELEASE_CERT_SHA256: ${{ vars.HARMONY_RELEASE_CERT_SHA256 }}
          HARMONY_RELEASE_KEY_ALIAS: ${{ secrets.HARMONY_RELEASE_KEY_ALIAS }}
          HARMONY_RELEASE_KEY_PASSWORD: ${{ secrets.HARMONY_RELEASE_KEY_PASSWORD }}
          HARMONY_RELEASE_KEYSTORE_BASE64: ${{ secrets.HARMONY_RELEASE_KEYSTORE_BASE64 }}
          HARMONY_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_RELEASE_KEYSTORE_PASSWORD }}
          HARMONY_RELEASE_PROFILE_BASE64: ${{ secrets.HARMONY_RELEASE_PROFILE_BASE64 }}
          HARMONY_RELEASE_SBOM_PATH: dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.sbom.cdx.json
        run: |
          set -euo pipefail
          mkdir -p dist
          npm run sign:release -- \
            entry/build/default/outputs/default/entry-default-unsigned.hap \
            "dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.hap"

      - name: Stage non-secret build evidence
        run: |
          set -euo pipefail
          cp "$HARMONY_RELEASE_TOOLCHAIN_EVIDENCE_PATH" \
            "dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.toolchain.json"
          cp "$HARMONY_RELEASE_BUILD_EVIDENCE_PATH" \
            "dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.build-evidence.txt"

      - name: Attest verified HAP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.hap

      - name: Attest verified HAP SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.hap
          sbom-path: mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.sbom.cdx.json

      - name: Upload verified HAP artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orca-mobile-harmony-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.hap
            mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.hap.evidence.json
            mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.sbom.cdx.json
            mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.toolchain.json
            mobile/harmony/dist/orca-mobile-harmony-${{ steps.release.outputs.version }}.build-evidence.txt

      - name: Clean Harmony runner residue
        if: always()
        run: |
          set -euo pipefail
          workspace="$(pwd -P)"
          expected_workspace="$(cd -- "$GITHUB_WORKSPACE/mobile/harmony" && pwd -P)"
          test "$workspace" = "$expected_workspace"
          runner_temp="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          test "$runner_temp" != / -a "$runner_temp" != "$workspace"

          safe_remove_workspace_path() {
            case "$1" in
              .hvigor|build|node_modules|oh_modules|dist|entry/.cxx|entry/build|\
              entry/oh_modules|entry/src/main/cpp/generated|\
              entry/src/main/resources/rawfile/assets)
                rm -rf -- "$1"
                ;;
              build-profile.json5|build-profile.local-backup.json5|local.properties|\
              entry/src/main/ets/RNOHPackagesFactory.ets|\
              entry/src/main/resources/rawfile/bundle.harmony.js|\
              entry/src/main/resources/rawfile/hermes_bundle.hbc)
                rm -f -- "$1"
                ;;
              *)
                echo "Refusing to clean unexpected workspace path: $1" >&2
                exit 1
                ;;
            esac
          }
          for path in \
            .hvigor build node_modules oh_modules dist entry/.cxx entry/build \
            entry/oh_modules entry/src/main/cpp/generated \
            entry/src/main/resources/rawfile/assets \
            build-profile.json5 build-profile.local-backup.json5 local.properties \
            entry/src/main/ets/RNOHPackagesFactory.ets \
            entry/src/main/resources/rawfile/bundle.harmony.js \
            entry/src/main/resources/rawfile/hermes_bundle.hbc; do
            safe_remove_workspace_path "$path"
          done
          if [ -d entry/src/main/ets/codegen ]; then
            test ! -L entry/src/main/ets/codegen
            find entry/src/main/ets/codegen -mindepth 1 ! -name .gitignore \
              -exec rm -rf -- {} +
          fi

          safe_remove_temp_path() {
            case "$1" in
              "$runner_temp"/orca-harmony-toolchain.json|\
              "$runner_temp"/orca-harmony-build-evidence.txt|\
              "$runner_temp"/orca-harmony-reference-release.hap|\
              "$runner_temp"/orca-harmony-release-rebuild|\
              "$runner_temp"/orca-harmony-codelinter.log|\
              "$runner_temp"/orca-harmony-sign-*)
                rm -rf -- "$1"
                ;;
              *)
                echo "Refusing to clean unexpected runner-temp path: $1" >&2
                exit 1
                ;;
            esac
          }
          for path in \
            "$HARMONY_RELEASE_TOOLCHAIN_EVIDENCE_PATH" \
            "$HARMONY_RELEASE_BUILD_EVIDENCE_PATH" \
            "$HARMONY_RELEASE_REFERENCE_HAP_PATH" \
            "$HARMONY_RELEASE_REBUILD_ROOT" \
            "$runner_temp/orca-harmony-codelinter.log"; do
            safe_remove_temp_path "$(cd -- "$(dirname -- "$path")" && pwd -P)/$(basename -- "$path")"
          done
          while IFS= read -r -d '' path; do
            safe_remove_temp_path "$path"
          done < <(find "$runner_temp" -mindepth 1 -maxdepth 1 -type d \
            -name 'orca-harmony-sign-*' -print0)

  simulator-acceptance:
    needs: build-and-sign
    runs-on: [self-hosted, macOS, ARM64, harmonyos, harmonyos-simulator]
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Verify exact simulator runner identity before checkout
        env:
          EXPECTED_RUNNER_NAME: ${{ vars.HARMONY_RELEASE_SIMULATOR_RUNNER_NAME }}
          SENTINEL_PATH: ${{ vars.HARMONY_RELEASE_SIMULATOR_RUNNER_SENTINEL_PATH }}
          EXPECTED_SENTINEL_SHA256: ${{ vars.HARMONY_RELEASE_SIMULATOR_RUNNER_SENTINEL_SHA256 }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted
          test "$ACTUAL_RUNNER_OS" = macOS
          test "$ACTUAL_RUNNER_ARCH" = ARM64
          test -n "$EXPECTED_RUNNER_NAME"
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$SENTINEL_PATH" = /Users/Shared/orca/harmony-simulator-runner.sentinel
          [[ "$EXPECTED_SENTINEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$SENTINEL_PATH"
          test ! -L "$SENTINEL_PATH"
          test "$(stat -f '%Su' "$SENTINEL_PATH")" = root
          test "$(stat -f '%Lp' "$SENTINEL_PATH")" = 644
          actual_sentinel_sha256="$(shasum -a 256 "$SENTINEL_PATH" | awk '{print $1}')"
          test "$actual_sentinel_sha256" = "$EXPECTED_SENTINEL_SHA256"

      - name: Checkout trusted source for simulator acceptance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pinned Node.js for simulator acceptance
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.4

      - name: Resolve simulator HDC
        env:
          CONFIGURED_DEVECO_HOME: ${{ vars.HARMONY_DEVECO_HOME }}
        run: |
          set -euo pipefail
          deveco_home="${CONFIGURED_DEVECO_HOME:-/Applications/DevEco-Studio.app/Contents}"
          hdc="$deveco_home/sdk/default/openharmony/toolchains/hdc"
          test -x "$hdc"
          echo "HARMONY_HDC=$hdc" >> "$GITHUB_ENV"

      - name: Download exact signed HAP for simulator acceptance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-sign.outputs.artifact_name }}
          path: dist

      - name: Run exact-HAP simulator acceptance
        env:
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            ''|*/*|*..*|*[!A-Za-z0-9._-]*)
              echo 'Release version is unsafe for runner-local paths' >&2
              exit 1
              ;;
          esac
          hap="dist/orca-mobile-harmony-$RELEASE_VERSION.hap"
          evidence_dir="$RUNNER_TEMP/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance"
          test -f "$hap"
          rm -rf -- "$evidence_dir"
          node mobile/harmony/scripts/run-harmony-simulator-acceptance.mjs \
            --hap "$hap" \
            --hdc "$HARMONY_HDC" \
            --output-dir "$evidence_dir"
          cp "$evidence_dir/evidence.json" \
            "$evidence_dir/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance.json"

      - name: Attest simulator acceptance evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/orca-mobile-harmony-${{ needs.build-and-sign.outputs.version }}.simulator-acceptance/orca-mobile-harmony-${{ needs.build-and-sign.outputs.version }}.simulator-acceptance.json

      - name: Upload simulator acceptance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orca-mobile-harmony-${{ needs.build-and-sign.outputs.version }}-simulator-acceptance
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/orca-mobile-harmony-${{ needs.build-and-sign.outputs.version }}.simulator-acceptance

      - name: Clean simulator acceptance runner residue
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            ''|*/*|*..*|*[!A-Za-z0-9._-]*)
              echo 'Release version is unsafe for runner-local paths' >&2
              exit 1
              ;;
          esac
          workspace="$(pwd -P)"
          expected_workspace="$(cd -- "$GITHUB_WORKSPACE" && pwd -P)"
          test "$workspace" = "$expected_workspace"
          runner_temp="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          test "$runner_temp" != / -a "$runner_temp" != "$workspace"
          rm -rf -- "$workspace/dist"
          evidence_dir="$runner_temp/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance"
          case "$evidence_dir" in
            "$runner_temp"/orca-mobile-harmony-*.simulator-acceptance) ;;
            *) echo 'Refusing to clean unexpected simulator evidence path' >&2; exit 1 ;;
          esac
          rm -rf -- "$evidence_dir"

  publish-release:
    needs: [build-and-sign, simulator-acceptance]
    if: needs.build-and-sign.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: harmony-production-publish
    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Verify physical acceptance approval policy
        env:
          GH_TOKEN: ${{ github.token }}
          HARMONY_RELEASE_ENVIRONMENT: harmony-production-publish
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG_PATTERN: mobile-harmony-v*
        run: |
          set -euo pipefail
          policy="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$HARMONY_RELEASE_ENVIRONMENT")"
          reviewer_count="$(printf '%s' "$policy" | jq \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')"
          prevent_self_review="$(printf '%s' "$policy" | jq -r \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review] | any')"
          test "$reviewer_count" -gt 0
          test "$prevent_self_review" = true
          deployment_policy_ok="$(printf '%s' "$policy" | jq -r '
            .deployment_branch_policy as $policy |
            if $policy != null and
              $policy.protected_branches == false and
              $policy.custom_branch_policies == true
            then "true" else "false" end')"
          test "$deployment_policy_ok" = true
          branch_policies="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$HARMONY_RELEASE_ENVIRONMENT/deployment-branch-policies")"
          printf '%s' "$branch_policies" | jq -e \
            --arg branch "$RELEASE_BRANCH" --arg tag_pattern "$RELEASE_TAG_PATTERN" '
              any(.branch_policies[]?; .type == "branch" and .name == $branch) and
              any(.branch_policies[]?; .type == "tag" and .name == $tag_pattern)
            ' >/dev/null
          case "$GITHUB_REF" in
            "refs/heads/$RELEASE_BRANCH"|refs/tags/${RELEASE_TAG_PATTERN}) ;;
            *)
              echo "Release ref $GITHUB_REF is outside the configured branch/tag policy" >&2
              exit 1
              ;;
          esac

      - name: Checkout trusted source for hosted re-verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pinned Node.js for hosted re-verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.4

      - name: Download verified HAP artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-sign.outputs.artifact_name }}
          path: dist

      - name: Download simulator acceptance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orca-mobile-harmony-${{ needs.build-and-sign.outputs.version }}-simulator-acceptance
          path: dist/simulator-acceptance

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          hap="dist/orca-mobile-harmony-$RELEASE_VERSION.hap"
          sbom="dist/orca-mobile-harmony-$RELEASE_VERSION.sbom.cdx.json"
          simulator_acceptance="dist/simulator-acceptance/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance.json"
          test -f "$hap"
          test -f "$sbom"
          test -f "$simulator_acceptance"
          gh attestation verify "$hap" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mobile-harmony-release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_SHA"
          sbom_attestations="$(gh attestation verify "$hap" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mobile-harmony-release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_SHA" \
            --predicate-type 'https://cyclonedx.org/bom' \
            --format json)"
          printf '%s\n' "$sbom_attestations" | jq -e --slurpfile expected "$sbom" \
            '($expected | length == 1) and
             any(.[]; .verificationResult.statement.predicate == $expected[0])'
          gh attestation verify "$simulator_acceptance" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/mobile-harmony-release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_SHA"

      - name: Bind physical acceptance approval to HAP
        env:
          GH_TOKEN: ${{ github.token }}
          HARMONY_RELEASE_ENVIRONMENT: harmony-production-publish
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          approval_history="$RUNNER_TEMP/orca-harmony-approval-history.json"
          trap 'rm -f -- "$approval_history"' EXIT
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            > "$approval_history"
          node mobile/harmony/scripts/verify-harmony-physical-acceptance.mjs \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.hap" \
            "$approval_history" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.physical-acceptance.json"

      - name: Reverify downloaded release semantics and provenance
        env:
          HARMONY_RELEASE_CERT_SHA256: ${{ vars.HARMONY_RELEASE_CERT_SHA256 }}
          HARMONY_RELEASE_ENVIRONMENT: harmony-production-publish
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          node mobile/harmony/scripts/verify-harmony-publish-artifacts.mjs \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.hap" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.hap.evidence.json" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.sbom.cdx.json" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.toolchain.json" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.build-evidence.txt" \
            "dist/simulator-acceptance/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance.json" \
            "dist/orca-mobile-harmony-$RELEASE_VERSION.physical-acceptance.json"

      - name: Pin release tag to the verified source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-sign.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            >/dev/null 2>&1; then
            tag_type="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq .object.type)"
            tag_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq .object.sha)"
            existing_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
              --jq .sha)"
            test "$tag_type" = commit -o "$tag_type" = tag
            test -n "$tag_sha"
            test "$existing_sha" = "$GITHUB_SHA"
            echo "Verified $RELEASE_TAG ($tag_type $tag_sha) -> $existing_sha"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              >/dev/null
            echo "Created $RELEASE_TAG -> $GITHUB_SHA"
          fi

      - name: Record publishing OS and GitHub CLI evidence
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          {
            echo "os=$(uname -srv) ($(uname -m))"
            echo "git=$(git --version)"
            echo "gh=$(gh --version | sed -n '1p' | tr -d '\r')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create or update trusted prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-sign.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-and-sign.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "dist/orca-mobile-harmony-$RELEASE_VERSION.hap"
            "dist/orca-mobile-harmony-$RELEASE_VERSION.hap.evidence.json"
            "dist/orca-mobile-harmony-$RELEASE_VERSION.sbom.cdx.json"
            "dist/orca-mobile-harmony-$RELEASE_VERSION.toolchain.json"
            "dist/orca-mobile-harmony-$RELEASE_VERSION.build-evidence.txt"
            "dist/simulator-acceptance/orca-mobile-harmony-$RELEASE_VERSION.simulator-acceptance.json"
            "dist/orca-mobile-harmony-$RELEASE_VERSION.physical-acceptance.json"
          )
          digest_pattern='^sha256:[0-9a-f]{64}$'
          if release_json="$(gh release view \
            "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,author,assets,url 2>/dev/null)"; then
            release_tag="$(printf '%s' "$release_json" | jq -r .tagName)"
            release_draft="$(printf '%s' "$release_json" | jq -r .isDraft)"
            release_prerelease="$(printf '%s' "$release_json" | jq -r .isPrerelease)"
            release_author="$(printf '%s' "$release_json" | jq -r '.author.login // empty')"
            test "$release_tag" = "$RELEASE_TAG"
            test "$release_draft" = false
            test "$release_prerelease" = true
            test "$release_author" = 'github-actions[bot]'
            echo "Updating trusted prerelease $RELEASE_TAG authored by $release_author"
            while IFS= read -r remote_name; do
              known_asset=false
              for asset_path in "${assets[@]}"; do
                if [ "$(basename "$asset_path")" = "$remote_name" ]; then
                  known_asset=true
                  break
                fi
              done
              if [ "$known_asset" != true ]; then
                echo "Refusing to update release with unexpected asset $remote_name" >&2
                exit 1
              fi
            done < <(printf '%s' "$release_json" | jq -r '.assets[].name')

            missing_assets=()
            for asset_path in "${assets[@]}"; do
              asset_name="$(basename "$asset_path")"
              local_size="$(wc -c < "$asset_path" | tr -d '[:space:]')"
              local_digest="sha256:$(sha256sum "$asset_path" | awk '{print $1}')"
              remote_size="$(printf '%s' "$release_json" | jq -r \
                --arg name "$asset_name" '.assets[] | select(.name == $name) | .size')"
              if [ -z "$remote_size" ]; then
                missing_assets+=("$asset_path")
                continue
              fi
              remote_digest="$(printf '%s' "$release_json" | jq -r \
                --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest // empty')"
              test "$remote_size" = "$local_size"
              if ! [[ "$remote_digest" =~ $digest_pattern ]]; then
                echo "Release asset $asset_name has no valid SHA-256 digest" >&2
                exit 1
              fi
              test "$remote_digest" = "$local_digest"
              echo "Verified existing release asset $asset_name ($local_size bytes)"
            done
            if [ "${#missing_assets[@]}" -gt 0 ]; then
              gh release upload \
                "$RELEASE_TAG" \
                "${missing_assets[@]}" \
                --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create \
              "$RELEASE_TAG" \
              "${assets[@]}" \
              --generate-notes \
              --latest=false \
              --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orca Mobile Harmony $RELEASE_TAG"
          fi

          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,author,assets,url)"
          test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$RELEASE_TAG"
          test "$(printf '%s' "$release_json" | jq -r .isDraft)" = false
          test "$(printf '%s' "$release_json" | jq -r .isPrerelease)" = true
          test "$(printf '%s' "$release_json" | jq -r '.author.login // empty')" = \
            'github-actions[bot]'
          for asset_path in "${assets[@]}"; do
            asset_name="$(basename "$asset_path")"
            local_size="$(wc -c < "$asset_path" | tr -d '[:space:]')"
            remote_size="$(printf '%s' "$release_json" | jq -r \
              --arg name "$asset_name" '.assets[] | select(.name == $name) | .size')"
            test -n "$remote_size"
            test "$remote_size" = "$local_size"
            remote_digest="$(printf '%s' "$release_json" | jq -r \
              --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest // empty')"
            if ! [[ "$remote_digest" =~ $digest_pattern ]]; then
              echo "Release asset $asset_name has no valid SHA-256 digest" >&2
              exit 1
            fi
            local_digest="sha256:$(sha256sum "$asset_path" | awk '{print $1}')"
            test "$remote_digest" = "$local_digest"
            echo "Verified release asset $asset_name ($local_size bytes)"
          done
